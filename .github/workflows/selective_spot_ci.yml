name: selective-spot-ci

on:
  push:
    branches:
      - exp/selective-2term-spot
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU PyTorch dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Compile Python
        run: |
          python -m compileall -q recu_hw tools

      - name: CLI import smoke
        run: |
          python -m tools.audit_selective_spot --help >/dev/null
          python -m tools.eval_selective_spot_sweep --help >/dev/null
          python -m tools.train_selective_spot --help >/dev/null
          python -m tools.select_selective_spot_candidate --help >/dev/null
          python -m tools.build_selective_spot_report --help >/dev/null

      - name: Selective SPoT tests
        run: |
          python -m unittest tests.test_spot_affine tests.test_selective_spot tests.test_spot_hardware -v

      - name: Full unit test suite
        run: |
          python -m unittest discover -s tests -v
